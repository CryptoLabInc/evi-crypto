name: Windows build checks

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-msvc:
    name: Build MSVC
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenSSL
        shell: pwsh
        run: choco install openssl --yes --no-progress

      - name: Discover OpenSSL paths
        shell: pwsh
        run: |
          $roots = @(
            "C:\Program Files\OpenSSL-Win64",
            "C:\Program Files\OpenSSL",
            "C:\tools\openssl",
            "C:\Program Files (x86)\OpenSSL-Win32"
          ) | Where-Object { Test-Path $_ }

          if ($roots.Count -eq 0) {
            throw "OpenSSL installation root not found"
          }

          $crypto = $null
          $ssl = $null
          $include = $null
          $rootDir = $null

          foreach ($root in $roots) {
            $crypto = Get-ChildItem -Path $root -Recurse -Filter libcrypto.lib -ErrorAction SilentlyContinue | Select-Object -First 1
            $ssl = Get-ChildItem -Path $root -Recurse -Filter libssl.lib -ErrorAction SilentlyContinue | Select-Object -First 1
            if ((Test-Path (Join-Path $root "include\openssl\ssl.h")) -and $crypto -and $ssl) {
              $include = Join-Path $root "include"
              $rootDir = $root
              break
            }
          }

          if (-not $rootDir) {
            throw "Failed to discover OpenSSL headers and libraries"
          }

          "OPENSSL_ROOT_DIR=$rootDir" >> $env:GITHUB_ENV
          "OPENSSL_INCLUDE_DIR=$include" >> $env:GITHUB_ENV
          "OPENSSL_CRYPTO_LIBRARY=$($crypto.FullName)" >> $env:GITHUB_ENV
          "OPENSSL_SSL_LIBRARY=$($ssl.FullName)" >> $env:GITHUB_ENV
          "$rootDir\bin" >> $env:GITHUB_PATH

          Write-Host "Using OPENSSL_ROOT_DIR=$rootDir"
          Write-Host "Using OPENSSL_INCLUDE_DIR=$include"
          Write-Host "Using OPENSSL_CRYPTO_LIBRARY=$($crypto.FullName)"
          Write-Host "Using OPENSSL_SSL_LIBRARY=$($ssl.FullName)"

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DOPENSSL_ROOT_DIR="${env:OPENSSL_ROOT_DIR}" `
            -DOPENSSL_INCLUDE_DIR="${env:OPENSSL_INCLUDE_DIR}" `
            -DOPENSSL_CRYPTO_LIBRARY="${env:OPENSSL_CRYPTO_LIBRARY}" `
            -DOPENSSL_SSL_LIBRARY="${env:OPENSSL_SSL_LIBRARY}" `
            -DBUILD_TEST=ON `
            -DBUILD_EXAMPLE=OFF `
            -DBUILD_KEY_MANAGEMENT=ON `
            -DBUILD_AS_STATIC=ON `
            -DEVI_KM_PREFER_AWS_SDK=OFF `
            -DEVI_KM_PREFER_GCP_SDK=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

  build-mingw:
    name: Build MinGW
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Setup MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TEST=ON \
            -DBUILD_EXAMPLE=OFF \
            -DBUILD_KEY_MANAGEMENT=ON \
            -DBUILD_AS_STATIC=ON \
            -DEVI_KM_PREFER_AWS_SDK=OFF \
            -DEVI_KM_PREFER_GCP_SDK=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
